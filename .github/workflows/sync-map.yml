name: Sync BlueMap

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Pull BlueMap web files via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
        run: |
          mkdir -p docs
          lftp -u "$SFTP_USER,$SFTP_PASS" sftp://$SFTP_HOST:$SFTP_PORT \
            -e "set sftp:auto-confirm yes; mirror --verbose /bluemap/web ./docs; bye"

      - name: Commit and push if changed
        run: |
          git config user.name "map-bot"
          git config user.email "actions@github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update map $(date -u)"
          git push
